name: KMP CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM + Android (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform for compileSdk
        shell: bash
        run: |
          set -euo pipefail
          COMPILE_SDK="$(grep -Eo 'android-compileSdk\s*=\s*"[0-9]+"' gradle/libs.versions.toml | sed -E 's/.*"([0-9]+)".*/\1/' || true)"
          if [ -z "${COMPILE_SDK}" ]; then
            echo "Unable to detect android-compileSdk in gradle/libs.versions.toml"
            exit 1
          fi
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}"

      - name: Build and test JVM/Android modules
        run: |
          ./gradlew \
            :shared:check \
            :composeApp:jvmTest \
            :server:test \
            :androidApp:lintDebug \
            :androidApp:assembleDebug \
            --stacktrace \
            --no-daemon

  ios:
    name: iOS (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test iOS targets
        run: |
          ./gradlew \
            :shared:iosSimulatorArm64Test \
            :composeApp:iosSimulatorArm64Test \
            --stacktrace \
            --no-daemon
