name: PR Size Label

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Read size thresholds
        id: sizes
        shell: bash
        run: |
          {
            echo "json<<EOF"
            cat .github/pr-size-labeler.yml
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Apply PR size label
        uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: ${{ steps.sizes.outputs.json }}

