# Sample workflow for building and deploying an Astro site to GitHub Pages
#
# To get started with Astro see: https://docs.astro.build/en/getting-started/
#
name: Deploy Astro site to Pages

on:
  # Runs on pushes targeting the stable release branch
  push:
    branches: ["main"]
    paths:
      - 'website/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "website" # default value when not using subfolders
  # BUILD_PATH: subfolder

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Detect package manager
        id: detect-package-manager
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          if [ -f "${GITHUB_WORKSPACE}/website/yarn.lock" ]; then
            {
              echo "manager=yarn"
              echo "lockfile=yarn.lock"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          elif [ -f "${GITHUB_WORKSPACE}/website/package.json" ]; then
            {
              echo "manager=npm"
              echo "lockfile=package-lock.json"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ">=22.12.0"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/${{ steps.detect-package-manager.outputs.lockfile }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        shell: bash
        env:
          MANAGER: ${{ steps.detect-package-manager.outputs.manager }}
        run: |
          if [ "${MANAGER}" = "yarn" ]; then
            yarn install
          else
            npm ci
          fi
        working-directory: ${{ env.BUILD_PATH }}
      - name: Check with Astro
        shell: bash
        env:
          MANAGER: ${{ steps.detect-package-manager.outputs.manager }}
        run: |
          if [ "${MANAGER}" = "yarn" ]; then
            yarn run check
          else
            npm run check
          fi
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        shell: bash
        env:
          MANAGER: ${{ steps.detect-package-manager.outputs.manager }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "${MANAGER}" = "yarn" ]; then
            yarn astro build \
              --site "${SITE_ORIGIN}" \
              --base "${SITE_BASE}"
          else
            npx --no-install astro build \
              --site "${SITE_ORIGIN}" \
              --base "${SITE_BASE}"
          fi
        working-directory: ${{ env.BUILD_PATH }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
