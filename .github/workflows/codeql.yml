name: "CodeQL (manual build for Kotlin 2.3.x)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      # runner temp used for Android SDK when needed
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL (manual build mode)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin, javascript
          build-mode: manual

      # Optional: Android SDK install if needed (keeps from failing Android builds)
      - name: Install Android SDK if needed
        if: ${{ always() }}
        run: |
          if [ -d "androidApp" ] || [ -d "androidapp" ] || grep -qE 'android-compileSdk\\s*=\\s*\"[0-9]+\"' gradle/libs.versions.toml 2>/dev/null; then
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
            TMPDIR=$(mktemp -d)
            cd "$TMPDIR"
            curl -sSfL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            mv cmdline-tools/* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/" || true
            export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager --update
            # try to get compileSdk (fallback is 33)
            COMPILE_SDK=$(grep -Eo 'android-compileSdk\\s*=\\s*\"[0-9]+\"' gradle/libs.versions.toml 2>/dev/null || true)
            if [ -n "$COMPILE_SDK" ]; then
              COMPILE_SDK=$(echo "$COMPILE_SDK" | sed -E 's/.*"([0-9]+)".*/\\1/')
            else
              COMPILE_SDK=33
            fi
            sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;33.0.2" || true
            cd -
            rm -rf "$TMPDIR"
          else
            echo "No Android module detected, skipping SDK install."
          fi

      - name: Prepare and run Gradle build (manual)
        run: |
          chmod +x ./gradlew || true
          # ensure no stale daemons and run an explicit build (skip tests to speed up)
          ./gradlew --stop || true
          ./gradlew clean assemble -x test --no-daemon --no-parallel
        env:
          JAVA_HOME: ${{ runner.tool_cache }}/temurin/17

      - name: Build website (website/)
        if: ${{ always() && (exists('website/package.json') || github.event_name == 'schedule') }}
        working-directory: website
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json in website/, skipping"
          fi

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
