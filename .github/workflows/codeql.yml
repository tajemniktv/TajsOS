name: "CodeQL (manual build for Kotlin 2.3+ support, using preinstalled Android SDK)"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analyze (java-kotlin + javascript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties','gradle/libs.versions.toml') }}

      # Initialize CodeQL for java-kotlin in manual mode (avoid Kotlin extractor interception)
      - name: Initialize CodeQL for java-kotlin (manual build-mode)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Initialize CodeQL for javascript in none mode (JS extractor doesn't support manual)
      - name: Initialize CodeQL for javascript (none build-mode)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          build-mode: none

      - name: Detect website (website/package.json) presence
        id: check_website
        run: |
          if [ -f website/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect Android module / compileSdk
        id: check_android
        run: |
          android_needed=false
          compile_sdk=""
          if [ -d "androidApp" ] || [ -d "androidapp" ]; then
            android_needed=true
          fi
          if grep -qE 'android-compileSdk\s*=\s*"[0-9]+' gradle/libs.versions.toml 2>/dev/null; then
            android_needed=true
            compile_sdk=$(grep -Eo 'android-compileSdk\s*=\s*"[0-9]+"' gradle/libs.versions.toml | sed -E 's/.*"([0-9]+)".*/\1/')
          fi
          if [ -z "$compile_sdk" ]; then
            compile_sdk=33
          fi
          echo "android_needed=${android_needed}" >> $GITHUB_OUTPUT
          echo "compile_sdk=${compile_sdk}" >> $GITHUB_OUTPUT

      - name: Configure Android SDK (use runner preinstalled SDK)
        if: ${{ steps.check_android.outputs.android_needed == 'true' }}
        run: |
          set -euo pipefail
          # Prefer runner-provided ANDROID_HOME; fall back to ANDROID_SDK_ROOT if set
          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK_DIR="$ANDROID_HOME"
            echo "Using preinstalled Android SDK at $SDK_DIR"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_DIR="$ANDROID_SDK_ROOT"
            echo "Using ANDROID_SDK_ROOT at $SDK_DIR"
          else
            echo "No preinstalled Android SDK found (ANDROID_HOME / ANDROID_SDK_ROOT not set)" >&2
            exit 1
          fi

          # Export consistent env vars for Gradle and other tools
          echo "ANDROID_HOME=${SDK_DIR}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> $GITHUB_ENV

          # Add platform-tools and common cmdline-tools locations to PATH for subsequent steps
          if [ -d "${SDK_DIR}/platform-tools" ]; then
            echo "PATH=${SDK_DIR}/platform-tools:${PATH}" >> $GITHUB_ENV
          fi
          if [ -d "${SDK_DIR}/cmdline-tools/latest/bin" ]; then
            echo "PATH=${SDK_DIR}/cmdline-tools/latest/bin:${PATH}" >> $GITHUB_ENV
          elif [ -d "${SDK_DIR}/tools/bin" ]; then
            echo "PATH=${SDK_DIR}/tools/bin:${PATH}" >> $GITHUB_ENV
          fi

          # Print SDK layout for debugging purposes
          echo "SDK_DIR contents:"
          ls -la "$SDK_DIR" || true

      - name: Prepare and run Gradle build (manual)
        run: |
          chmod +x ./gradlew || true
          # ensure no stale daemons and run an explicit build (skip tests to speed up)
          ./gradlew --stop || true
          ./gradlew clean assemble -x test --no-daemon --no-parallel

      - name: Set up Node 22 (for website build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm for website
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-website-${{ hashFiles('website/package-lock.json', 'website/package.json') }}

      - name: Build website (website/)
        if: ${{ steps.check_website.outputs.exists == 'true' || github.event_name == 'schedule' }}
        working-directory: website
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json in website/: skipping website build."
          fi

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
