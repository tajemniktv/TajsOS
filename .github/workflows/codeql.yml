name: "CodeQL (manual build for Kotlin 2.3+ support)"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analyze (java-kotlin + javascript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export ANDROID_SDK_ROOT (linter-friendly)
        run: |
          echo "ANDROID_SDK_ROOT=${RUNNER_TEMP}/android-sdk" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties','gradle/libs.versions.toml') }}

      # Initialize CodeQL for Java/Kotlin in manual mode (avoids Kotlin extractor intercept)
      - name: Initialize CodeQL for java-kotlin (manual build-mode)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Initialize CodeQL for JavaScript in none mode (JS doesn't support manual)
      - name: Initialize CodeQL for javascript (none build-mode)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          build-mode: none

      - name: Detect website (website/package.json) presence
        id: check_website
        run: |
          if [ -f website/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect Android module / compileSdk
        id: check_android
        run: |
          android_needed=false
          compile_sdk=""
          if [ -d "androidApp" ] || [ -d "androidapp" ]; then
            android_needed=true
          fi
          if grep -qE 'android-compileSdk\s*=\s*"[0-9]+' gradle/libs.versions.toml 2>/dev/null; then
            android_needed=true
            compile_sdk=$(grep -Eo 'android-compileSdk\s*=\s*"[0-9]+"' gradle/libs.versions.toml | sed -E 's/.*"([0-9]+)".*/\1/')
          fi
          if [ -z "$compile_sdk" ]; then
            compile_sdk=33
          fi
          echo "android_needed=${android_needed}" >> $GITHUB_OUTPUT
          echo "compile_sdk=${compile_sdk}" >> $GITHUB_OUTPUT

      - name: Install Android SDK (only if needed)
        if: ${{ steps.check_android.outputs.android_needed == 'true' }}
        run: |
          set -euo pipefail
          echo "Installing Android command-line tools and platform ${COMPILE_SDK:-${{ steps.check_android.outputs.compile_sdk }}}"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          curl -sSfL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          mv cmdline-tools/* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/" || true
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --update
          COMPILE_SDK="${{ steps.check_android.outputs.compile_sdk }}"
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;33.0.2" || true
          cd -
          rm -rf "$TMPDIR"

      - name: Prepare and run Gradle build (manual)
        run: |
          chmod +x ./gradlew || true
          # ensure no stale daemons and run an explicit build (skip tests to speed up)
          ./gradlew --stop || true
          ./gradlew clean assemble -x test --no-daemon --no-parallel

      - name: Set up Node 22 (for website build)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Cache npm for website
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-website-${{ hashFiles('website/package-lock.json', 'website/package.json') }}

      - name: Build website (website/)
        if: ${{ steps.check_website.outputs.exists == 'true' || github.event_name == 'schedule' }}
        working-directory: website
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json in website/: skipping website build."
          fi

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
