name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      kmp: ${{ steps.filter.outputs.kmp }}
      website: ${{ steps.filter.outputs.website }}
      docs: ${{ steps.filter.outputs.docs }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      website_only: ${{ steps.classify.outputs.website_only }}
      run_gradle: ${{ steps.classify.outputs.run_gradle }}
      run_website: ${{ steps.classify.outputs.run_website }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'LICENSE*'
              - '.github/ISSUE_TEMPLATE/**'
            website:
              - 'website/**'
            kmp:
              - 'androidApp/**'
              - 'composeApp/**'
              - 'shared/**'
              - 'server/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'

      - name: Classify run scope
        id: classify
        shell: bash
        run: |
          docs_only=false
          website_only=false
          run_gradle=false
          run_website=false

          if [[ "${{ steps.filter.outputs.docs }}" == "true" && "${{ steps.filter.outputs.website }}" != "true" && "${{ steps.filter.outputs.kmp }}" != "true" ]]; then
            docs_only=true
          fi

          if [[ "${{ steps.filter.outputs.website }}" == "true" && "${{ steps.filter.outputs.kmp }}" != "true" ]]; then
            website_only=true
          fi

          if [[ "${{ steps.filter.outputs.kmp }}" == "true" ]]; then
            run_gradle=true
          fi

          if [[ "${{ steps.filter.outputs.website }}" == "true" ]]; then
            run_website=true
          fi

          {
            echo "docs_only=${docs_only}"
            echo "website_only=${website_only}"
            echo "run_gradle=${run_gradle}"
            echo "run_website=${run_website}"
          } >> "${GITHUB_OUTPUT}"

  gradle:
    name: Gradle Build and Tests
    needs: changes
    if: ${{ needs.changes.outputs.run_gradle == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-gradle-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          COMPILE_SDK="$(grep -Eo 'android-compileSdk\s*=\s*"[0-9]+"' gradle/libs.versions.toml | sed -E 's/.*"([0-9]+)".*/\1/' || true)"
          if [ -z "${COMPILE_SDK}" ]; then
            echo "Unable to detect android-compileSdk in gradle/libs.versions.toml"
            exit 1
          fi
          (yes || true) | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}"

      - name: Prepare google-services config for CI
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -f "androidApp/google-services.json" ]; then
            echo "Found androidApp/google-services.json in workspace."
            exit 0
          fi

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" > androidApp/google-services.json
            echo "Wrote androidApp/google-services.json from repository secret."
            exit 0
          fi

          # Public CI fallback: generate a harmless placeholder so build tasks can run
          # without requiring private Firebase project credentials in the repository.
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.tajemniktv.tajsos"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyCIPlaceholderKey"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build and test
        shell: bash
        run: |
          ./gradlew \
            :shared:jvmTest \
            :composeApp:jvmTest \
            :server:test \
            :androidApp:lintDebug \
            :androidApp:assembleDebug \
            :koverXmlReport \
            --stacktrace \
            --no-daemon

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          fail_ci_if_error: true # Now that it's more intentional, failures should be addressed
          name: kmp-unit-tests

      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          directory: .
          fail_ci_if_error: false

      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-failure-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/logs/**
            **/*.log

      - name: Upload build artifacts on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: main-build-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            androidApp/build/outputs/**/*.apk
            composeApp/build/compose/binaries/**
            server/build/libs/*.jar

  website:
    name: Website Build
    needs: changes
    if: ${{ needs.changes.outputs.run_website == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-website-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build website
        working-directory: website
        run: |
          npm ci
          npm run build --if-present

      - name: Upload website dist on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: website-dist-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: website/dist

  summary:
    name: Workflow Summary
    needs: [changes, gradle, website]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- KMP changes: \`${{ needs.changes.outputs.kmp }}\`"
            echo "- Website changes: \`${{ needs.changes.outputs.website }}\`"
            echo "- Docs changes: \`${{ needs.changes.outputs.docs }}\`"
            echo "- Docs-only change: \`${{ needs.changes.outputs.docs_only }}\`"
            echo "- Website-only change: \`${{ needs.changes.outputs.website_only }}\`"
            echo ""
            echo "### Jobs"
            echo "- Gradle job: \`${{ needs.gradle.result || 'skipped' }}\`"
            echo "- Website job: \`${{ needs.website.result || 'skipped' }}\`"
            echo ""
            echo "### Artifacts"
            echo "- Failure reports: uploaded only when Gradle job fails"
            echo "- Main build artifacts: uploaded on push to \`main\`"
            echo "- Website dist artifact: uploaded on website builds to \`main\`"
          } >> "${GITHUB_STEP_SUMMARY}"
