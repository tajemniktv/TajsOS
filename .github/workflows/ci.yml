name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      kmp: ${{ steps.filter.outputs.kmp }}
      website: ${{ steps.filter.outputs.website }}
      docs: ${{ steps.filter.outputs.docs }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      website_only: ${{ steps.classify.outputs.website_only }}
      run_gradle: ${{ steps.classify.outputs.run_gradle }}
      run_website: ${{ steps.classify.outputs.run_website }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'LICENSE*'
              - '.github/ISSUE_TEMPLATE/**'
            website:
              - 'website/**'
            kmp:
              - 'androidApp/**'
              - 'composeApp/**'
              - 'shared/**'
              - 'server/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'

      - name: Classify run scope
        id: classify
        shell: bash
        env:
          FILTER_DOCS: ${{ steps.filter.outputs.docs }}
          FILTER_WEBSITE: ${{ steps.filter.outputs.website }}
          FILTER_KMP: ${{ steps.filter.outputs.kmp }}
        run: |
          docs_only=false
          website_only=false
          run_gradle=false
          run_website=false

          if [[ "${FILTER_DOCS}" == "true" && "${FILTER_WEBSITE}" != "true" && "${FILTER_KMP}" != "true" ]]; then
            docs_only=true
          fi

          if [[ "${FILTER_WEBSITE}" == "true" && "${FILTER_KMP}" != "true" ]]; then
            website_only=true
          fi

          if [[ "${FILTER_KMP}" == "true" ]]; then
            run_gradle=true
          fi

          if [[ "${FILTER_WEBSITE}" == "true" ]]; then
            run_website=true
          fi

          {
            echo "docs_only=${docs_only}"
            echo "website_only=${website_only}"
            echo "run_gradle=${run_gradle}"
            echo "run_website=${run_website}"
          } >> "${GITHUB_OUTPUT}"

  gradle:
    name: Gradle Build and Tests
    needs: changes
    if: ${{ needs.changes.outputs.run_gradle == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-gradle-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          dependency-graph: disabled

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Prepare Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          (yes || true) | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"

      - name: Prepare google-services config for CI
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -f "androidApp/google-services.json" ]; then
            echo "Found androidApp/google-services.json in workspace."
            mkdir -p androidApp/src/debug
            mkdir -p androidApp/src/release
            cp androidApp/google-services.json androidApp/src/debug/google-services.json || true
            cp androidApp/google-services.json androidApp/src/release/google-services.json || true
            exit 0
          fi

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" > androidApp/google-services.json
            echo "Wrote androidApp/google-services.json from repository secret."
            mkdir -p androidApp/src/debug
            mkdir -p androidApp/src/release
            cp androidApp/google-services.json androidApp/src/debug/google-services.json || true
            cp androidApp/google-services.json androidApp/src/release/google-services.json || true
            exit 0
          fi

          # Public CI fallback: generate a harmless placeholder so build tasks can run
          # without requiring private Firebase project credentials in the repository.
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.tajemniktv.tajsos"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyCIPlaceholderKey"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          mkdir -p androidApp/src/debug
          mkdir -p androidApp/src/release
          cp androidApp/google-services.json androidApp/src/debug/google-services.json || true
          cp androidApp/google-services.json androidApp/src/release/google-services.json || true

      - name: Build and test
        shell: bash
        run: |
          ./gradlew \
            -Pandroid.builder.sdkDownload=true \
            :shared:jvmTest \
            :composeApp:jvmTest \
            :server:test \
            :androidApp:lintDebug \
            :androidApp:assembleDebug \
            :koverXmlReport \
            --stacktrace \
            --no-daemon

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/kover/report.xml') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/kover/report.xml
          fail_ci_if_error: false # Codecov GPG verify is broken
          skip_validation: true
          name: kmp-unit-tests

      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          directory: .
          fail_ci_if_error: false
          skip_validation: true

      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gradle-failure-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/logs/**
            **/*.log

      - name: Upload build artifacts on dev
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-build-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            androidApp/build/outputs/**/*.apk
            composeApp/build/compose/binaries/**
            server/build/libs/*.jar

  website:
    name: Website Build
    needs: changes
    if: ${{ needs.changes.outputs.run_website == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-website-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build website
        working-directory: website
        run: |
          npm ci
          npm run build --if-present

      - name: Upload website dist on dev
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-dist-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: website/dist

  summary:
    name: Workflow Summary
    needs: [changes, gradle, website]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_KMP: ${{ needs.changes.outputs.kmp }}
          CHANGES_WEBSITE: ${{ needs.changes.outputs.website }}
          CHANGES_DOCS: ${{ needs.changes.outputs.docs }}
          CHANGES_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES_WEBSITE_ONLY: ${{ needs.changes.outputs.website_only }}
          GRADLE_RESULT: ${{ needs.gradle.result || 'skipped' }}
          WEBSITE_RESULT: ${{ needs.website.result || 'skipped' }}
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "- Ref: \`${REF_NAME}\`"
            echo "- Event: \`${EVENT_NAME}\`"
            echo "- KMP changes: \`${CHANGES_KMP}\`"
            echo "- Website changes: \`${CHANGES_WEBSITE}\`"
            echo "- Docs changes: \`${CHANGES_DOCS}\`"
            echo "- Docs-only change: \`${CHANGES_DOCS_ONLY}\`"
            echo "- Website-only change: \`${CHANGES_WEBSITE_ONLY}\`"
            echo ""
            echo "### Jobs"
            echo "- Gradle job: \`${GRADLE_RESULT}\`"
            echo "- Website job: \`${WEBSITE_RESULT}\`"
            echo ""
            echo "### Artifacts"
            echo "- Failure reports: uploaded only when Gradle job fails"
            echo "- Dev build artifacts: uploaded on push to \`dev\`"
            echo "- Website dist artifact: uploaded on website builds to \`dev\`"
          } >> "${GITHUB_STEP_SUMMARY}"
