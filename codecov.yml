# @format

# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: true

comment:
  behavior: default
  layout: "reach,diff,flags,files"
  require_changes: false # Show comment even if coverage doesn't change

component_management:
  default_rules:
    statuses:
      - target: auto
        threshold: 1%
        type: project
  individual_components:
    - component_id: shared
      name: shared
      paths:
        - shared/.*
    - component_id: composeApp
      name: composeApp
      paths:
        - composeApp/.*
    - component_id: server
      name: server
      paths:
        - server/.*
    - component_id: androidApp
      name: androidApp
      paths:
        - androidApp/.*

coverage:
  precision: 2
  range: "70...100"
  round: down
  status:
    patch:
      default:
        # coverage of the pull request itself
        informational: true # Do not block PRs based on patch coverage
        target: auto
        threshold: 1%
    project:
      default:
        # project-wide coverage
        target: auto
        threshold: 1% # Allow up to 1% drop# Disable noisy line annotations in GitHub Checks

github_checks:
  annotations: true
