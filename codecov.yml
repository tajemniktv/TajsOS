# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # project-wide coverage
        target: auto
        threshold: 1% # Allow up to 1% drop
    patch:
      default:
        # coverage of the pull request itself
        target: auto
        threshold: 1%
        informational: true # Do not block PRs based on patch coverage

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false # Show comment even if coverage doesn't change

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: shared
      name: shared
      paths:
        - shared/.*
    - component_id: composeApp
      name: composeApp
      paths:
        - composeApp/.*
    - component_id: server
      name: server
      paths:
        - server/.*
    - component_id: androidApp
      name: androidApp
      paths:
        - androidApp/.*

# Disable noisy line annotations in GitHub Checks
github_checks:
  annotations: false
