kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M -XX:+UseParallelGC
# Keep compiler capacity for KMP builds, but release idle compiler memory after five minutes.
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.options=autoshutdownIdleSeconds=300,shutdownDelayMilliseconds=1000
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
# Retain warm daemons during active edits, not for hours after a build session.
org.gradle.daemon.idletimeout=300000
org.gradle.vfs.watch=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
