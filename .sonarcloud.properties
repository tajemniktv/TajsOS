# Project identification
sonar.projectKey=tajemniktv_TajsOS
sonar.projectName=TajsOS
sonar.projectVersion=1.0.1

# Sources - main code directories found in your repo
sonar.sources=shared,composeApp,androidApp,iosApp,server,website,kotlin-js-store

# Include typical test directories (if present)
sonar.tests=shared/src/commonTest,kotlin,composeApp/src/commonTest,kotlin,androidApp/src/test,kotlin,iosApp/src/test,swift,server/src/test,kotlin,kotlin-js-store/test,website/tests

# File type inclusions (scan all related languages)
sonar.inclusions=**/*.kt,**/*.kts,**/*.swift,**/*.astro,**/*.js,**/*.css,**/*.html

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude generated/build and meta files
# sonar.exclusions=**/build/**,**/.gradle/**,**/buildSrc/**,**/*.md,**/node_modules/**,**/generated/**,**/*.svg

# Optional: Set SCM for Git (if using)
sonar.scm.provider=git

# Optional: code coverage reporting (add these if you have coverage reports configured)
# sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
# sonar.kotlin.coverage.reportPaths=build/reports/kover/report.xml

# Optional: Swift Lint reports (if iOS uses SwiftLint)
# sonar.swift.swiftlint.reportPaths=swiftlint_report.json
