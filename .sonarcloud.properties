# Path to sources
sonar.sources=androidApp/src,composeApp/src,shared/src,server/src,website/src
sonar.exclusions=**/build/**,**/bin/**,**/release/**,**/iosApp/**,**/website/dist/**,**/website/node_modules/**,**/.gradle/**,**/gradle/wrapper/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.ico,**/*.icns,**/*.otf,**/*.ttf,**/*.jar,**/*.apk
sonar.inclusions=**/*.kt,**/*.kts,**/*.java,**/*.xml,**/*.properties,**/*.json,**/*.js,**/*.ts,**/*.tsx,**/*.astro,**/*.css,**/*.html,**/*.swift

# Path to tests
sonar.tests=shared/src/commonTest,shared/src/jvmTest,composeApp/src/commonTest,composeApp/src/jvmTest,server/src/test
sonar.test.exclusions=**/build/**,**/bin/**
sonar.test.inclusions=**/*Test.kt,**/*Tests.kt,**/*Test.java,**/*Tests.java

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions for copy-paste detection
sonar.cpd.exclusions=**/composeResources/**,**/src/**/resources/**,**/*.json,**/*.xml,**/*.md,**/*.astro,**/*.css,**/*.html